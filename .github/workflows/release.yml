name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "バージョンのインクリメント方法を選択"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: "patch"

permissions:
  contents: write

jobs:
  bump:
    name: Bump
    uses: ./.github/workflows/bump.yml
    with:
      version_bump: ${{ inputs.version_bump }}
    secrets: inherit

  publish:
    name: Publish
    needs: bump
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.bump.outputs.version }}
    secrets: inherit
