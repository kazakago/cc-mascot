name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "リリース対象のGitタグ（空欄の場合はpackage.jsonのバージョンから自動取得）"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "リリース対象のGitタグ（例: v1.3.0）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit

  create-release:
    name: Create release
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve release tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: release-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*
